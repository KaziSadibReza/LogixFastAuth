<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1544 500" width="1544" height="500" role="img" aria-label="Smart Login Registration banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1544" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1f0c2e"/>
      <stop offset="1" stop-color="#3a1240"/>
    </linearGradient>
    <radialGradient id="glow" cx="340" cy="250" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d6336c" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#d6336c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="slrGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#d6336c"/>
      <stop offset="0.55" stop-color="#c2349a"/>
      <stop offset="1" stop-color="#ae3ec9"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="560" y1="0" x2="980" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d6336c"/>
      <stop offset="1" stop-color="#ae3ec9"/>
    </linearGradient>
  </defs>
  <rect width="1544" height="500" fill="url(#bg)"/>
  <rect width="1544" height="500" fill="url(#glow)"/>
  <g transform="translate(150,100) scale(4.6875)">
    <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#slrGrad)"/>
    <circle cx="32" cy="22" r="7.5" fill="none" stroke="#ffffff" stroke-width="5.5"/>
    <path d="M32 30 V49" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M32 42 H40" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
  </g>
  <text x="560" y="222" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="98" font-weight="800" letter-spacing="-2" fill="#ffffff">Smart Login</text>
  <text x="560" y="322" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="98" font-weight="800" letter-spacing="-2" fill="#ffffff">Registration</text>
  <rect x="564" y="352" width="120" height="6" rx="3" fill="url(#accentLine)"/>
  <text x="564" y="410" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="500" fill="#e9c8f5">Secure login, OTP &amp; passkeys for WordPress</text>
</svg>
